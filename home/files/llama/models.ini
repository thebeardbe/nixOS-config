; Model presets for the llama.cpp router.
;
; The server is started with --models-dir /models and
; --models-preset /presets/models.ini. A section whose name matches a GGUF file
; in /models becomes that model's default configuration; the "model" key below
; makes each section self-contained, so a missing or renamed file fails loudly
; instead of silently ignoring the settings.
;
; THE NUMBERS BELOW ARE STARTING POINTS, NOT TUNED VALUES. Context sizes are set
; by the client, not by what the model could do: the `pi` agent's baseline
; prompt (AGENTS.md, every skill, the core system prompt, roughly fifteen tool
; schemas) is far larger than 16k tokens before any conversation, so a context
; that looks generous for the model is still too small to serve a request. The
; n-cpu-moe values are what pays for those contexts: routed expert weights moved
; into system RAM free VRAM for the KV cache, at a decode-speed cost. Both are
; meant to be corrected by measurement: watch the VRAM figure in `nvidia-smi`,
; the "offloaded N/M layers" and "CPU buffer size" lines in the server log, and
; the prompt-processing timings. The two MoE models are the ones that need it:
; n-cpu-moe trades VRAM for system RAM and bandwidth, and the batch sizes drive
; how fast the CPU half chews through a prompt.
;
; Context length is deliberately prioritised over decode speed here: a few tens
; of tokens per second is acceptable for code assistance, whereas a context too
; small to hold the client's prompt cannot be traded against anything at all.
; That priority is what the context sizes below are tuned against, and the
; bounds are the models' own trained contexts: 131072 for the E4B and 262144 for
; the Qwen, beyond which llama.cpp would have to scale positions and lose
; quality. Both context sizes below are measured, and what separates them is
; attention: the Gemma 4 models use sliding-window layers and cost 13.2 MiB of
; KV cache per 1024 tokens, whereas the Qwen uses full attention and costs
; 51.0 MiB, so the same VRAM buys roughly four times less context on it.
;
; reasoning-budget exists because these models think before they answer. Left
; uncapped, a long think can consume the client's entire output budget, and the
; request comes back with an empty answer; the cap leaves room for the answer
; while staying high enough that normal reasoning is not cut short.
;
; Flash attention and the 8-bit KV cache are set once for every model on the
; server command line (see compose.yaml); only per-model settings live here.
; Keys are llama.cpp long option names without the leading dashes, and ";"
; starts a comment.

version = 1

[*]
; No model is loaded when the container starts. Combined with
; --no-models-autoload this means loading always takes an explicit request.

[gemma-4-E4B-it-Q4_K_M]
; ~4.6 GiB dense model: it fits in VRAM with room to spare, so every layer is
; offloaded and the context is raised to the agent client's baseline prompt size.
;
; 81920 is derived rather than picked: this model's KV cache costs about 13.2
; MiB per 1024 tokens (server VRAM measured at 3616 MiB for 32768 and 3832 MiB
; for 49152), so the step up from 49152 spends another ~420 MiB and takes the
; 2485 MiB that was free there down to roughly 2 GiB, with the desktop's ~1450
; MiB already counted in both figures. That leftover margin is the target, not
; the largest context that fits: the card also has to survive the desktop
; growing. The result stays well inside the model's 131072 trained context, so
; it needs no position scaling.
model = /models/gemma-4-E4B-it-Q4_K_M.gguf
ctx-size = 81920
n-gpu-layers = 99
; Same empty-answer failure mode as the MoE models below, capped lower because
; this is the fast interactive model: an unproductive think costs the most here,
; where the whole point is a reply within a sentence or two of waiting.
reasoning-budget = 1024

[gemma-4-26B-A4B-it-UD-IQ4_XS]
; ~12.7 GiB, 30-layer MoE. It cannot fit in 8 GB, so the attention and shared
; expert tensors go to the GPU and the routed expert weights of all 30 layers
; stay in system RAM. That is a deliberate trade of VRAM for context: the agent
; client needs a context this model cannot hold alongside its weights, and
; offloading experts is the only way to free the VRAM to pay for it. 30 is the
; ceiling, so this is all the headroom this preset can produce.
;
; The spare VRAM at 49152 (roughly 2 GB of the 8 GB was free there) is spent on
; KV cache rather than on walking n-cpu-moe back down, which follows from the
; context-over-speed priority: 14.4 tokens/s decode is accepted, so doubling to
; 98304 buys prompt headroom at a speed cost that is already priced in. The
; q8_0 KV cache and this model's sliding-window layers make that growth slower
; than a plain transformer's, but 98304 is a measured ceiling rather than a
; computed one: the headroom left at that context is unknown until it has been
; loaded, so treat it as the first value to reduce if CUDA runs out of VRAM.
model = /models/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
ctx-size = 98304
n-gpu-layers = 99
n-cpu-moe = 30
; Uncapped, this model's long reasoning can eat the client's whole output budget
; and return an empty answer; 2048 still covers its normal chain of thought.
reasoning-budget = 2048
; mmap + mlock: the CPU-resident experts are memory-mapped, and the intent is
; to pin them in RAM so the kernel does not evict them mid-inference (an
; eviction here means a multi-gigabyte disk read per token). The lock is
; best-effort: if llama.cpp cannot grant it, it logs a warning and continues
; with the pages unlocked, so a failed lock only shows up in the server log.
load-mode = mmap+mlock
; lazy-mode off: never read tensor rows from disk on demand. For per-layer
; embeddings that shows up as a disk read on every token.
lazy-mode = off
; Large batches. With the experts on the CPU, prompt processing is limited by
; the CPU half and is very sensitive to batch size, so both the logical and the
; physical batch are raised well above the defaults.
batch-size = 4096
ubatch-size = 1024

[Qwen3-Coder-30B-A3B-Instruct-IQ4_XS]
; ~15.3 GiB, 48-layer MoE, treated like the model above: attention and shared
; expert on the GPU, routed experts in RAM. It has more layers and a larger file
; than the 26B, and its layer split has not been watched against VRAM and speed,
; so all 48 layers are offloaded as a deliberately conservative starting point:
; expect to lower it if CUDA runs out of memory.
;
; 81920 is measurement-backed, not projected: 180224 was tried first and failed
; while allocating the KV cache (8976 MiB on device 0, cudaMalloc out of
; memory), which also pins the cost exactly at 51.0 MiB of KV per 1024 tokens.
; That is four times the E4B's rate because this model uses full attention
; rather than sliding-window attention, so the 8 GB card caps it near 101000
; tokens with nothing left over at all; 81920 spends about 4080 MiB of KV and
; leaves roughly 1 GiB free, which is the margin the desktop needs. It needs no
; RoPE or YaRN scaling in any case: the trained context is 262144.
model = /models/Qwen3-Coder-30B-A3B-Instruct-IQ4_XS.gguf
ctx-size = 81920
n-gpu-layers = 99
n-cpu-moe = 48
; Uncapped reasoning can consume the client's entire output budget and leave an
; empty answer; 2048 matches the 26B, which has the same failure mode.
reasoning-budget = 2048
load-mode = mmap+mlock
lazy-mode = off
batch-size = 4096
ubatch-size = 1024
