# Local llama.cpp router server for the RTX 3060 Ti.
#
# Lifecycle is MANUAL: restart policy is "no" and there is no boot unit, so
# nothing starts this at boot or after a Docker restart. That is deliberate.
# Control it with the `llama` command:
#   llama up      start now (creates the container on first use)
#   llama stop    stop, keeping the container for a fast restart
#   llama down    stop and remove the container
#   llama status / llama logs / llama help
#
# Server is in router mode: no single model is configured, GGUFs are discovered
# from /models, and each request picks one through its "model" field. At most
# one model is resident at a time, so a request for a different model evicts
# the least recently used one. Loading itself is explicit (POST /models/load,
# or the /llama menu in the pi agent).

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # Manual lifecycle: never start on boot, never come back by itself after a
    # Docker daemon restart. `llama up` starts it.
    restart: "no"

    # Three access paths, each declared where it can actually be relied on.
    #
    # Loopback is for the local agent on this machine; that traffic never
    # leaves the host.
    #
    # The LAN address is for other devices on the home network. It is a DHCP
    # lease, but the router carries a reservation for this machine, so the
    # address is always 192.168.100.12. Binding it is safe only because this
    # container is started by hand and has no boot-time unit: by then the
    # address is always assigned, whereas Docker refuses to start a container
    # whose published address is missing and would take the loopback publish
    # down with it. Not 0.0.0.0, which would also publish on the tailnet and on
    # every other interface that ever appears here.
    #
    # Docker DNATs published ports before the packet reaches the NixOS INPUT
    # chain, so `networking.firewall` cannot filter either binding. The API key
    # is the access control for both.
    #
    # The tailnet gets no published address. It is reached through
    # `tailscale serve`, declared system-side in
    # hosts/theConstruct/system/llama.nix: that address can legitimately be
    # absent, and publishing it made the whole container fail to start whenever
    # it was not yet assigned, which took this loopback publish down with it and
    # broke the local agent.
    ports:
      - "127.0.0.1:21434:21434"
      - "192.168.100.12:21434:21434"

    volumes:
      # Read-write: the router scans this directory for GGUFs, and the operator
      # drops new files in here without touching the container. It sits on a
      # dedicated ext4 data partition on the NVMe, not under /home, so the
      # models do not consume the partition that also holds the home directory
      # and the Docker data root.
      - /mnt/the-grail/llama-models:/models
      # Deployed by home-manager from the repo. Read-only: the server only
      # reads presets.
      - /home/thebeardbe/.config/llama/models.ini:/presets/models.ini:ro
      # Read-only key list. The file is generated on this host by the
      # generateLlamaApiKey home-manager activation (theConstruct only) and is
      # never committed and never copied into the Nix store.
      # create_host_path: false makes a missing key fail the container start
      # instead of letting Docker create a directory over the path, and
      # llama.cpp throws when it cannot open the file, so a missing key stops
      # the server instead of leaving it unauthenticated.
      #
      # Rotate by deleting ~/.config/llama/api-key, rebuilding (the activation
      # recreates it because it only ever creates), then re-running the pi
      # agent's /login for the llama.cpp provider.
      - type: bind
        source: /home/thebeardbe/.config/llama/api-key
        target: /run/secrets/llama-api-key
        read_only: true
        bind:
          create_host_path: false

    environment:
      # Without this the Hugging Face cache is the container's own
      # ~/.cache/llama.cpp, so models downloaded through the API would vanish
      # when the container is recreated and never appear on the host.
      LLAMA_CACHE: /models

    # CDI device: dockerd resolves this into the driver libraries and device
    # nodes generated by `nvidia-container-toolkit-cdi-generator`. Only the
    # GPU is exposed.
    devices:
      - nvidia.com/gpu=all

    # Memory budget: this host has 32 GiB. The largest preset maps a ~15 GiB
    # model whose routed experts stay in system RAM, plus that mapping's page
    # cache, its KV cache and compute buffers. 24 GiB admits all of that and
    # still leaves 8 GiB for the desktop session and the rest of the system.
    mem_limit: 24g

    # Locked memory. The two MoE models keep their routed experts in system RAM
    # and map them with mlock so that, while inference runs, the kernel keeps
    # those pages resident; an eviction here is a multi-gigabyte disk read per
    # token. IPC_LOCK permits the mlock call and the memlock ulimit below sets
    # the lock budget to the container's own memory limit. Both are the
    # ordinary mlock controls and neither depends on the IPC namespace.
    cap_add:
      - IPC_LOCK
    ulimits:
      # Finite rather than unlimited: the lock stays inside the same 24 GiB
      # budget as the container, so it cannot pin memory the desktop needs. A
      # value of -1 would leave the lock unbounded.
      memlock:
        soft: 25769803776
        hard: 25769803776

    command:
      # Router rules: bind inside the container, discover the models, and do
      # not load anything until asked.
      - --host
      - 0.0.0.0
      - --port
      - "21434"
      # Key list read from the mounted file. A file (not --api-key) keeps the
      # secret out of the process table and out of `docker inspect` output.
      - --api-key-file
      - /run/secrets/llama-api-key
      - --models-dir
      - /models
      - --models-preset
      - /presets/models.ini
      # One resident model. When a request names a different one, the router
      # unloads the least recently used instance to free the slot, which is what
      # keeps the 8 GB card from being oversubscribed.
      - --models-max
      - "1"
      # Autoload on. A sub-agent pinned to a model asks for it by name, and with
      # loading disabled that request fails with "model is not loaded" before
      # the agent can do anything. Autoload costs one cold load (6-12 s) on a
      # model's first use, which is paid once per run rather than per request.
      # --models-max 1 still bounds VRAM to a single resident model, so nothing
      # can accumulate. Stopping the container remains the way to free the GPU.
      - --models-autoload
      # Jinja chat templates. Required for tool calling.
      - --jinja
      # Flash attention: smaller KV cache and the faster kernel here.
      - --flash-attn
      - "on"
      # 8-bit K and V cache. Halves the KV VRAM cost against the f16 default,
      # which is what lets a 32k context fit on this card.
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0

    # The image's built-in healthcheck probes port 8080, which this stack does
    # not serve, so it would never turn healthy. Probe the port the server is
    # actually on, and cover a cold load of the largest model before the first
    # check counts.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:21434/health"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
