# hyprpaper 0.8.x dropped `preload` and the empty-monitor `wallpaper = ,<path>`
# form: an empty monitor matches no output, so it logs "Monitor <name> has no
# target: no wp will be created" and applies nothing. Wallpapers are applied per
# output by the `set-wallpaper` script (called from the Lua autostart and from
# goto-workspace / pick-wallpaper), so nothing wallpaper-related belongs here.
splash = false
